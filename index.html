<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban Donato Turismo — Diversão Garantida</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0a2351;--blue:#0861ae;--gold:#f2b52c;--bg:#f2f6fc;--ink:#15284b;--muted:#64748b;--line:#d6e0ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
header{background:linear-gradient(110deg,#081c43,#0861ae);color:#fff;padding:22px max(18px,calc((100% - 1440px)/2))}
h1{font-family:Georgia,serif;font-size:clamp(25px,3vw,38px);margin:0}.slogan{color:var(--gold);letter-spacing:.22em;font-weight:800;font-size:12px;margin-top:4px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{border:0;border-radius:9px;padding:10px 13px;background:#e5edf9;color:var(--ink);cursor:pointer;font-weight:600}button.primary{background:var(--gold)}button.danger{background:#fee2e2;color:#991b1b}button:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1440px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 16px}.stat,.panel,.column,.task{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:14px}.stat strong{font-size:24px;display:block}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;background:white;border:1px solid var(--line);padding:10px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 5px #102b4a0a}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd7e8;border-radius:8px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:70px;resize:vertical}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:stretch}.column{min-width:260px;width:260px;flex-shrink:0;padding:10px;background:#edf2f9;min-height:330px;display:flex;flex-direction:column}.colhead{display:flex;justify-content:space-between;font-weight:750;margin:2px 0 12px}.count{border-radius:20px;background:var(--navy);color:#fff;padding:2px 8px}.cards{display:flex;flex-direction:column;gap:10px;flex:1}.task{padding:12px;border-left:4px solid var(--gold);box-shadow:0 2px 4px #13294a0a}.task h3{font-size:15px;margin:9px 0 5px}.desc,.meta{color:var(--muted);line-height:1.45}.tag{display:inline-block;background:#e4edf8;border-radius:20px;padding:3px 8px;font-size:11px;margin:3px 3px 0 0}.priority{font-size:11px;border-radius:5px;padding:3px 6px;background:#e0edff}.overdue{color:#dc2626}.taskcontrols{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}.taskcontrols select{flex:1;padding:7px;font-size:12px}.column .add{margin-top:10px;text-align:left;background:transparent;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:10px 0}.statusline{font-size:13px;margin:8px 0 14px}.hidden{display:none!important}.authwrap{max-width:440px;margin:38px auto}.panel{padding:22px}.panel h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-weight:650;margin-bottom:5px}.row{display:flex;gap:8px}.row>*{flex:1}
dialog{border:1px solid var(--line);border-radius:16px;width:min(560px,calc(100% - 24px));padding:0;box-shadow:0 20px 60px #0b1c3a35}dialog::backdrop{background:#07142c88}.modal{padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.column{min-width:82vw;width:82vw}.top{align-items:flex-start}}

/* Melhorias visuais Donato Turismo */
header {
  box-shadow: 0 8px 24px #07142c20;
}

.stat, .panel {
  box-shadow: 0 4px 14px #0a23510d;
}

.column {
  border-top: 5px solid #94a3b8;
  border-radius: 14px;
  box-shadow: 0 5px 16px #0a23510d;
}

.column[data-col="ideias"] {
  border-top-color: #8b5cf6;
}

.column[data-col="afazer"] {
  border-top-color: #3b82f6;
}

.column[data-col="andamento"] {
  border-top-color: #14b8a6;
}

.column[data-col="aguardando"] {
  border-top-color: #f59e0b;
}

.column[data-col="concluido"] {
  border-top-color: #22c55e;
}

.task {
  border-radius: 12px;
  box-shadow: 0 3px 10px #0a23510d;
  transition: transform .16s ease, box-shadow .16s ease;
}

.task:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px #0a235118;
}

.priority {
  display: inline-block;
  border-radius: 999px;
  padding: 4px 9px;
  font-weight: 800;
}

.tag {
  border-radius: 999px;
}
</style>
</head>
<body>
<header><div class="top"><div><h1>Kanban Donato Turismo</h1><div class="slogan">DIVERSÃO GARANTIDA</div></div>
<div class="actions"><button id="exportBtn">⇩ Exportar backup</button><button id="importBtn">⇧ Importar backup</button><button class="primary" id="newBtn">＋ Nova tarefa</button><button id="logoutBtn" class="hidden">Sair</button></div></div></header>
<section id="auth" class="authwrap"><div class="panel"><h2>Acessar seu Kanban</h2><p class="note">Entre com seu e-mail para acessar as tarefas sincronizadas na nuvem.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" placeholder="voce@exemplo.com"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="Mínimo de 8 caracteres"></div><div class="row"><button id="loginBtn" class="primary">Entrar</button><button id="signupBtn">Criar conta</button></div><p id="authMsg" class="statusline" aria-live="polite"></p></div></section>
<main id="app" class="hidden">
<div id="status" class="statusline" aria-live="polite">Conectando à nuvem…</div>
<div class="stats"><div class="stat"><strong id="total">0</strong>Total de tarefas</div><div class="stat"><strong id="progress">0</strong>Em andamento</div><div class="stat"><strong id="late">0</strong>Atrasadas</div><div class="stat"><strong id="done">0</strong>Concluídas</div></div>
<div class="toolbar"><input id="search" placeholder="Buscar tarefas…"><select id="filterAssignee"><option value="">Todos os responsáveis</option></select><select id="filterPriority"><option value="">Todas as prioridades</option><option>Baixa</option><option>Média</option><option>Alta</option><option>Urgente</option></select><select id="filterTour"><option value="">Todos os passeios</option></select><button id="clearFilters">Limpar</button></div>
<div class="board" id="board"></div><p class="note">Tarefas salvas no Supabase. Use Exportar backup para manter uma cópia local.</p>
</main>
<input id="fileInput" type="file" accept="application/json,.json" class="hidden">
<dialog id="taskDialog"><form id="taskForm" class="modal"><div class="modalhead"><h2 id="modalTitle">Nova tarefa</h2><button type="button" id="closeModal">✕</button></div>
<input type="hidden" id="taskId"><div class="field"><label>Título *</label><input id="title" required maxlength="160"></div><div class="field"><label>Descrição</label><textarea id="description"></textarea></div>
<div class="row"><div class="field"><label>Status</label><select id="statusSelect"><option value="ideias">Ideias e solicitações</option><option value="afazer">A fazer</option><option value="andamento">Em andamento</option><option value="aguardando">Aguardando retorno</option><option value="concluido">Concluído</option></select></div><div class="field"><label>Prioridade</label><select id="priority"><option>Baixa</option><option selected>Média</option><option>Alta</option><option>Urgente</option></select></div></div>
<div class="row"><div class="field"><label>Categoria</label><input id="category" placeholder="Ex.: Financeiro"></div><div class="field"><label>Responsável</label><input id="assignee"></div></div>
<div class="row"><div class="field"><label>Data limite</label><input id="dueDate" type="date"></div><div class="field"><label>Passeio</label><input id="tour"></div></div><div class="field"><label>Etiquetas (separadas por vírgula)</label><input id="tags"></div>
<div class="modalfoot"><button type="button" id="cancelModal">Cancelar</button><button type="submit" class="primary">Salvar tarefa</button></div><p id="formMsg" class="statusline"></p></form></dialog>
<script>
const SUPABASE_URL = "https://yjvpfqvitkioacjnczrz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QAovRVlVeXhqJNp6XwAoZA_c3_IUtKV";
const COLUMNS=[["ideias","Ideias e solicitações"],["afazer","A fazer"],["andamento","Em andamento"],["aguardando","Aguardando retorno"],["concluido","Concluído"]];
let sb=null,user=null,tasks=[],busy=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function statusMsg(t,err=false){$("status").textContent=t;$("status").style.color=err?"#b91c1c":"#166534"}
function localDate(d){if(!d)return "";const x=new Date(d+"T12:00:00");return x.toLocaleDateString("pt-BR")}
function overdue(t){return t.due_date&&t.due_date<new Date().toISOString().slice(0,10)&&t.status!=="concluido"}
function toForm(t={}){$("modalTitle").textContent=t.id?"Editar tarefa":"Nova tarefa";$("taskId").value=t.id||"";$("title").value=t.title||"";$("description").value=t.description||"";$("statusSelect").value=t.status||"afazer";$("priority").value=t.priority||"Média";$("category").value=t.category||"";$("assignee").value=t.assignee||"";$("dueDate").value=t.due_date||"";$("tour").value=t.tour||"";$("tags").value=(t.tags||[]).join(", ");$("formMsg").textContent="";$("taskDialog").showModal()}
function draft(){return {title:$("title").value.trim(),description:$("description").value.trim(),status:$("statusSelect").value,priority:$("priority").value,category:$("category").value.trim(),assignee:$("assignee").value.trim(),due_date:$("dueDate").value||null,tour:$("tour").value.trim(),tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean)}}
async function refresh(){if(!sb||!user)return;statusMsg("Carregando tarefas da nuvem…");const {data,error}=await sb.from("kanban_tasks").select("*").order("created_at",{ascending:false});if(error){statusMsg("Falha ao carregar da nuvem: "+error.message,true);return}tasks=data||[];render();statusMsg("Sincronizado com a nuvem • "+user.email)}
function filtered(){let q=$("search").value.toLowerCase(),a=$("filterAssignee").value,p=$("filterPriority").value,tour=$("filterTour").value;return tasks.filter(t=>(!q||[t.title,t.description,t.category,t.assignee,t.tour,(t.tags||[]).join(" ")].join(" ").toLowerCase().includes(q))&&(!a||t.assignee===a)&&(!p||t.priority===p)&&(!tour||t.tour===tour))}
function render(){let visible=filtered();$("total").textContent=tasks.length;$("progress").textContent=tasks.filter(t=>t.status==="andamento").length;$("late").textContent=tasks.filter(overdue).length;$("done").textContent=tasks.filter(t=>t.status==="concluido").length;
const ass=[...new Set(tasks.map(t=>t.assignee).filter(Boolean))].sort(),tours=[...new Set(tasks.map(t=>t.tour).filter(Boolean))].sort();const oldA=$("filterAssignee").value,oldT=$("filterTour").value;
$("filterAssignee").innerHTML='<option value="">Todos os responsáveis</option>'+ass.map(x=>`<option>${esc(x)}</option>`).join("");$("filterTour").innerHTML='<option value="">Todos os passeios</option>'+tours.map(x=>`<option>${esc(x)}</option>`).join("");$("filterAssignee").value=oldA;$("filterTour").value=oldT;
$("board").innerHTML=COLUMNS.map(([id,label])=>{let list=visible.filter(t=>t.status===id);return `<section class="column" data-col="${id}"><div class="colhead"><span>${label}</span><span class="count">${list.length}</span></div><div class="cards">${list.map(t=>`<article class="task" draggable="true" data-id="${t.id}" style="border-left-color:${overdue(t)?"#ef4444":"var(--gold)"}"><span class="priority">${esc(t.priority)}</span>${overdue(t)?'<span class="tag overdue">Atrasada</span>':''}<h3>${esc(t.title)}</h3>${t.description?`<div class="desc">${esc(t.description)}</div>`:''}<p class="meta">${esc(t.category||"")}${t.assignee?"<br>♙ "+esc(t.assignee):""}${t.due_date?"<br>▦ "+localDate(t.due_date):""}${t.tour?"<br>⌖ "+esc(t.tour):""}</p>${(t.tags||[]).map(g=>`<span class="tag">#${esc(g)}</span>`).join("")}<div class="taskcontrols"><select data-move="${t.id}" aria-label="Mover tarefa">${COLUMNS.map(c=>`<option value="${c[0]}" ${t.status===c[0]?"selected":""}>${c[1]}</option>`).join("")}</select><button data-edit="${t.id}">Editar</button><button class="danger" data-delete="${t.id}">Excluir</button></div></article>`).join("")}</div><button class="add" data-add="${id}">＋ Adicionar</button></section>`}).join("");
}
async function saveTask(e){e.preventDefault();let d=draft();if(!d.title)return;const id=$("taskId").value;busy=true;$("formMsg").textContent="Salvando na nuvem…";let result=id?await sb.from("kanban_tasks").update(d).eq("id",id).select().single():await sb.from("kanban_tasks").insert({...d,user_id:user.id}).select().single();busy=false;if(result.error){$("formMsg").textContent="Erro ao salvar: "+result.error.message;return} $("taskDialog").close();await refresh()}
async function updateStatus(id,status){const {error}=await sb.from("kanban_tasks").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(error){statusMsg("Erro ao mover tarefa: "+error.message,true);return}await refresh()}
async function deleteTask(id){if(!confirm("Excluir esta tarefa permanentemente?"))return;const {error}=await sb.from("kanban_tasks").delete().eq("id",id);if(error){statusMsg("Erro ao excluir: "+error.message,true);return}await refresh()}
async function auth(mode){$("authMsg").textContent="Aguarde…";const email=$("email").value.trim(),password=$("password").value;if(!email||password.length<8){$("authMsg").textContent="Informe e-mail e senha com pelo menos 8 caracteres.";return}const r=mode==="signup"?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error){$("authMsg").textContent=r.error.message;return}if(mode==="signup"&&!r.data.session){$("authMsg").textContent="Conta criada. Confira seu e-mail para confirmar o cadastro e depois entre.";return}await boot()}
async function boot(){const {data:{session}}=await sb.auth.getSession();user=session?.user||null;$("auth").classList.toggle("hidden",!!user);$("app").classList.toggle("hidden",!user);$("logoutBtn").classList.toggle("hidden",!user);$("newBtn").disabled=!user;$("exportBtn").disabled=!user;$("importBtn").disabled=!user;if(user){await refresh();if(!window._poll){window._poll=setInterval(refresh,10000);window.addEventListener("focus",()=>refresh());document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});sb.channel("task-changes").on("postgres_changes",{event:"*",schema:"public",table:"kanban_tasks",filter:"user_id=eq."+user.id},()=>refresh()).subscribe()}}}
$("loginBtn").onclick=()=>auth("login");$("signupBtn").onclick=()=>auth("signup");$("logoutBtn").onclick=async()=>{await sb.auth.signOut();tasks=[];render();await boot()};$("newBtn").onclick=()=>toForm();$("closeModal").onclick=$("cancelModal").onclick=()=>$("taskDialog").close();$("taskForm").onsubmit=saveTask;
$("board").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.add)toForm({status:b.dataset.add});if(b.dataset.edit)toForm(tasks.find(t=>t.id===b.dataset.edit));if(b.dataset.delete)deleteTask(b.dataset.delete)});
$("board").addEventListener("change",e=>{if(e.target.dataset.move)updateStatus(e.target.dataset.move,e.target.value)});$("board").addEventListener("dragstart",e=>{let c=e.target.closest("[data-id]");if(c)e.dataTransfer.setData("text/plain",c.dataset.id)});$("board").addEventListener("dragover",e=>{if(e.target.closest("[data-col]"))e.preventDefault()});$("board").addEventListener("drop",e=>{let c=e.target.closest("[data-col]");if(c){e.preventDefault();let id=e.dataTransfer.getData("text/plain");if(id)updateStatus(id,c.dataset.col)}});
["search","filterAssignee","filterPriority","filterTour"].forEach(id=>$(id).addEventListener("input",render));$("clearFilters").onclick=()=>{$("search").value="";$("filterAssignee").value="";$("filterPriority").value="";$("filterTour").value="";render()};
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify({app:"Kanban Donato Turismo",exportedAt:new Date().toISOString(),tasks},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="backup-kanban-donato.json";a.click();URL.revokeObjectURL(a.href)};
$("importBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text()),list=Array.isArray(data)?data:data.tasks;if(!Array.isArray(list))throw Error();if(!confirm(`Importar ${list.length} tarefas para a nuvem? Tarefas atuais serão mantidas; duplicatas podem ser criadas.`))return;for(const t of list){const d={title:t.title,description:t.description||"",status:COLUMNS.some(c=>c[0]===t.status)?t.status:"afazer",priority:["Baixa","Média","Alta","Urgente"].includes(t.priority)?t.priority:"Média",category:t.category||"",assignee:t.assignee||"",due_date:t.due_date||t.dueDate||null,tour:t.tour||"",tags:t.tags||[]};const {error}=await sb.from("kanban_tasks").insert({...d,user_id:user.id});if(error)throw error}await refresh();alert("Importação concluída.")}catch(err){alert("Não foi possível importar. Confira se o arquivo é um backup JSON válido. "+(err.message||""))}finally{e.target.value=""}};
(async()=>{if(SUPABASE_URL.startsWith("COLE_AQUI")||SUPABASE_ANON_KEY.startsWith("COLE_AQUI")){$("authMsg").textContent="Configuração pendente: adicione a URL e a chave publicável do Supabase no arquivo index.html.";return}try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);await boot();sb.auth.onAuthStateChange(()=>setTimeout(boot,0))}catch(e){$("authMsg").textContent="Não foi possível conectar ao banco: "+e.message}})();
</script>
</body></html>
